<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {cell_name}</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- PouchDB -->
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center">
    
    <!--
    TODO IA:
    - Page de login pour {cell_name}
    - Utilise la méthode login() de main.js
    - Redirige vers dashboard après connexion réussie
    -->

    <div id="app" 
         x-data="{
            username: '',
            password: '',
            error: null,
            isLoading: false,
            
            async doLogin() {
                this.isLoading = true;
                this.error = null;
                
                try {
                    // Appel à l'API de login
                    const response = await fetch('https://dev.markidiags.com/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            username: this.username, 
                            password: this.password 
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Stockage du token
                        localStorage.setItem('auth_token', result.token);
                        localStorage.setItem('user', JSON.stringify(result.user));
                        
                        // Redirection
                        window.location.href = '/dashboard';
                    } else {
                        this.error = result.error || 'Erreur de connexion';
                    }
                } catch (err) {
                    this.error = 'Erreur réseau : ' + err.message;
                } finally {
                    this.isLoading = false;
                }
            }
         }" 
         class="w-full max-w-md"
    >
        <div class="bg-white rounded-lg shadow-2xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Connexion</h1>
                <p class="text-gray-500 mt-2">{cell_name}</p>
            </div>

            <!-- Erreur -->
            <div x-show="error" 
                 class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded"
                 x-text="error"></div>

            <!-- Formulaire -->
            <form @submit.prevent="doLogin()" class="space-y-6">
                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">>
                        Nom d'utilisateur
                    </label>
                    <input 
                        type="text"
                        x-model="username"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        placeholder="admin"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">>
                        Mot de passe
                    </label>
                    <input 
                        type="password"
                        x-model="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                        placeholder="••••••••"
                    >
                </div>

                <!-- Submit -->
                <button 
                    type="submit"
                    :disabled="isLoading || !username || !password"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:bg-gray-400 disabled:cursor-not-allowed transition"
                >
                    <span x-show="!isLoading">Se connecter</span>
                    <span x-show="isLoading" class="flex items-center justify-center">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Connexion...
                    </span>
                </button>
            </form>

            <!-- Info -->
            <div class="mt-6 text-center text-sm text-gray-500">
                <p>🔐 Connexion sécurisée via JWT</p>
            </div>
        </div>
    </div>

</body>
</html>
