+ Choisis le layout approprié parmi:
  - "layouts/layout_app.html" (pages avec sidebar/nav - dashboard, listes)
  - "layouts/base.html" (pages simples sans nav - login, register, forgot)
+ Les layouts sont dans app/templates/layouts/ (accessible via ChoiceLoader)
+ Définit les blocs appropriés selon le layout choisi
+ x-data avec x-init sur le container principal
+ les assets du genre image sont dans app/static et donc accessible via src='/static/image.png'
+ IMPORTANT: Tous les boutons doivent avoir un @click="nomDuWorkflow()" pour appeler un workflow frontend
+ Exemple: <button @click="submitLogin()">Connexion</button>
-->

{% extends "layouts/base.html" %}

{% block page_title %}{cell_name}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4" x-data="{ cell_name: '{cell_name}' }" x-init="console.log('Page {cell_name} initialized')">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">Page {cell_name} en cours de développement</h1>
        <p class="text-gray-600 mb-4">En cours de développement</p>
        <button @click="exampleWorkflow()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Exemple de bouton avec workflow
        </button>
        <div class="text-sm text-gray-400 mt-4">Ce squelette sera enrichi par l'IA</div>
    </div>
</div>
{% endblock %}
