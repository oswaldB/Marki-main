<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{cell_name} - Marki</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold">{cell_name}</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Contenu principal -->
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-gray-600 mb-4">Maquette de la page {cell_name}.</p>
            
            <!-- Exemple de liste -->
            <div class="space-y-4">
                <div class="p-4 border rounded flex justify-between items-center">
                    <span>Item exemple</span>
                    <button id="btn-edit" class="px-3 py-1 bg-blue-500 text-white rounded">
                        Modifier
                    </button>
                </div>
            </div>
            
            <!-- Formulaire exemple -->
            <form class="mt-6 space-y-4">
                <input type="text" placeholder="Nom" 
                       class="w-full p-2 border rounded">
                
                <button id="btn-submit" type="submit" 
                        class="px-4 py-2 bg-green-500 text-white rounded">
                    Enregistrer
                </button>
            </form>
        </div>
    </main>
</body>
</html>
