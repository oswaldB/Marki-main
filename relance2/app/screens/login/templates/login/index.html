{{% extends "layouts/base.html" %}}

{{% block page_title %}}login{{% endblock %}}

{{% block content %}}
<div class="min-h-screen flex items-center justify-center p-4" 
     x-data="loginPage()" 
     x-init="init()">
    <div class="bg-white p-8 rounded-xl shadow-lg text-center max-w-md w-full">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">login</h1>
        
        <p class="text-gray-600 mb-4">Page login en cours de développement</p>
        
        <div class="space-y-4">
            <button @click="runWorkflow('hello')" 
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                Dire Hello
            </button>
        </div>
        
        <div class="text-sm text-gray-400 mt-4">
            <p>Message: <span x-text="message"></span></p>
        </div>
    </div>
</div>
{% endblock %}

{{% block scripts %}
<script src="{{ url_for('static', filename='js/workflows/login.js') }}"></script>
<script>
function loginPage() {{
    return {{
        message: '',
        
        init() {{
            console.log('[login] ✓ Page initialisée');
            
            // Vérifier les paramètres URL
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            if (name) {{
                console.log('[login] Paramètre name:', name);
                this.runWorkflow('hello', name);
            }}
        }},
        
        async runWorkflow(workflowName, params) {{
            console.log('[login] ✓ Workflow:', workflowName, params);
            
            if (typeof loginWorkflow !== 'undefined') {{
                const result = await loginWorkflow(params || 'toto');
                this.message = result;
            }} else {{
                console.error('[login] Workflow non chargé');
                this.message = 'Erreur: workflow non disponible';
            }}
        }}
    }};
}}
</script>
{% endblock %}
